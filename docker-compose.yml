name: netwatch

services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79
    ports:
      - "${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${ADGUARD_DNS_PORT:-53}:53/udp"
      - "8080:80/tcp"
      - "3001:3000/tcp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NETWATCH_ENV: ${NETWATCH_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/netwatch.db}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      NETWATCH_DEMO_MODE: ${NETWATCH_DEMO_MODE:-false}
      NETWATCH_SUBNET: ${NETWATCH_SUBNET:-192.168.1.0/24}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-32}
      OFFLINE_AFTER_MISSED_SCANS: ${OFFLINE_AFTER_MISSED_SCANS:-3}
      MONITORING_ENABLED: ${MONITORING_ENABLED:-true}
      SERVICE_SCAN_ENABLED: ${SERVICE_SCAN_ENABLED:-true}
      SERVICE_PORTS: ${SERVICE_PORTS:-22,53,80,443,445,3389}
      NEW_DEVICE_ALERTS: ${NEW_DEVICE_ALERTS:-true}
      NEW_DEVICE_POLICY: ${NEW_DEVICE_POLICY:-allow_alert}
      DEVICE_OFFLINE_ALERTS: ${DEVICE_OFFLINE_ALERTS:-true}
      NEW_SERVICE_ALERTS: ${NEW_SERVICE_ALERTS:-true}
      LATENCY_ALERTS: ${LATENCY_ALERTS:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      NETWATCH_TIMEZONE: ${NETWATCH_TIMEZONE:-UTC}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      NETWATCH_SECRET_KEY: ${NETWATCH_SECRET_KEY:-}
      ADGUARD_DNS_PORT: ${ADGUARD_DNS_PORT:-53}
    ports:
      - "8000:8000"
    volumes:
      - netwatch-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
    environment:
      NETWATCH_DEMO_MODE: ${NETWATCH_DEMO_MODE:-false}
      NETWATCH_SUBNET: ${NETWATCH_SUBNET:-192.168.1.0/24}
      NETWATCH_INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  netwatch-data:
  adguard-work:
  adguard-conf:
