<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NetWatch Desktop</title>
<style>body{font:16px system-ui;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:760px;margin:12vh auto;padding:32px}h1{font-size:36px}p{color:#94a3b8}.card{background:#1e293b;border-radius:14px;padding:20px;margin:20px 0}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155}.ok{color:#4ade80}.bad{color:#f87171}button{background:#38bdf8;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:#fbbf24;margin-top:16px}</style></head>
<body><main><h1>NetWatch</h1><p>Local desktop shell · loopback-only services</p><div class="card" id="status">Checking local services…</div><button id="restart">Restart local services</button> <button id="dashboard">Open dashboard</button><p>Technitium and router APIs are separate integrations. The shell remains useful for local monitoring when Docker or Technitium is unavailable.</p></main>
<script>const status=document.querySelector('#status'); const restart=document.querySelector('#restart'); const errorMessage=error=>error instanceof Error?error.message:String(error); const appendError=message=>{const error=document.createElement('div');error.className='error';error.textContent=message;status.append(error)}; const render=s=>{const values={Sensor:s.sensor??s.sensorReady,Backend:s.backend??s.backendReady,Frontend:s.frontend??s.frontendReady};status.replaceChildren();Object.entries(values).forEach(([key,value])=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=key;const result=document.createElement('strong');result.className=value?'ok':'bad';result.textContent=value?'Healthy':'Unavailable';row.append(label,result);status.append(row)});if(s.error)appendError(s.error);if(s.failures?.length)appendError(`Failed services: ${s.failures.join(', ')}. Check desktop.log, then retry.`)}; async function refresh(){try{render(await window.netwatchDesktop.status())}catch(error){status.replaceChildren();appendError(`Unable to read service status: ${errorMessage(error)}`)}} window.netwatchDesktop.onStartup(state=>render(state.started||state)); restart.onclick=async()=>{restart.disabled=true;restart.textContent='Restarting…';try{render(await window.netwatchDesktop.restart())}catch(error){render({error:`Restart failed: ${errorMessage(error)}`,failures:['sensor','backend','frontend']})}finally{restart.disabled=false;restart.textContent='Restart local services'}}; document.querySelector('#dashboard').onclick=()=>window.netwatchDesktop.openDashboard().catch(error=>appendError(`Could not open dashboard: ${errorMessage(error)}`)); refresh();</script></body></html>
