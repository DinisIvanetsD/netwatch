<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NetWatch Desktop</title>
<style>body{font:16px system-ui;margin:0;background:#0f172a;color:#e2e8f0}main{max-width:760px;margin:12vh auto;padding:32px}h1{font-size:36px}p{color:#94a3b8}.card{background:#1e293b;border-radius:14px;padding:20px;margin:20px 0}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #334155}.ok{color:#4ade80}.bad{color:#f87171}button{background:#38bdf8;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}</style></head>
<body><main><h1>NetWatch</h1><p>Local desktop shell · loopback-only services</p><div class="card" id="status">Checking local services…</div><button id="restart">Restart local services</button> <button id="dashboard">Open dashboard</button><p>Technitium and router APIs are separate integrations. The shell remains useful for local monitoring when Docker or Technitium is unavailable.</p></main>
<script>const status=document.querySelector('#status'); const render=s=>{status.innerHTML=Object.entries({Sensor:s.sensor,Backend:s.backend,Frontend:s.frontend}).map(([k,v])=>`<div class="row"><span>${k}</span><strong class="${v?'ok':'bad'}">${v?'Healthy':'Unavailable'}</strong></div>`).join('')}; async function refresh(){render(await window.netwatchDesktop.status())} window.netwatchDesktop.onStartup(()=>refresh()); document.querySelector('#restart').onclick=async()=>{await window.netwatchDesktop.restart();refresh()}; document.querySelector('#dashboard').onclick=()=>window.netwatchDesktop.openDashboard(); refresh();</script></body></html>
